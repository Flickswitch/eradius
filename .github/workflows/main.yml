name: CI

on:
  push:
  pull_request:
    branches: [ $default-branch ]
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ["29"]
    container:
      image: erlang:${{ matrix.otp }}-alpine
    env:
      # Set early so compile-time escripts and tests see legacy crypto (MD4/DES).
      OPENSSL_CONF: ${{ github.workspace }}/priv/openssl-legacy.cnf
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Prepare
      run: |
           set -euo pipefail
           apk update
           apk --no-cache upgrade
           apk --no-cache add git openssl
           if [ -d /usr/lib/ossl-modules ]; then
             echo "OPENSSL_MODULES=/usr/lib/ossl-modules" >> "$GITHUB_ENV"
             export OPENSSL_MODULES=/usr/lib/ossl-modules
           elif [ -d /usr/lib64/ossl-modules ]; then
             echo "OPENSSL_MODULES=/usr/lib64/ossl-modules" >> "$GITHUB_ENV"
             export OPENSSL_MODULES=/usr/lib64/ossl-modules
           else
             echo "::error::OpenSSL ossl-modules directory not found (need legacy provider for MS-CHAP MD4/DES)"
             exit 1
           fi
           if [ ! -f "$OPENSSL_CONF" ]; then
             echo "::error::OPENSSL_CONF missing at $OPENSSL_CONF"
             exit 1
           fi
           # Fail clearly if MD4 is unavailable (MS-CHAP / MPPE tests need it).
           erl -noshell -eval '
             case lists:member(md4, crypto:supports(hashs)) of
               true -> io:format("crypto: md4 OK~n"), halt(0);
               false ->
                 io:format(standard_error, "crypto: md4 NOT available — OpenSSL legacy provider not loaded~n", []),
                 halt(1)
             end.
           '
    - name: Build
      run: rebar3 compile
    - name: Run tests
      run: |
           rebar3 do xref
           rebar3 do ct
    - name: Coveralls
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: ${{ matrix.otp }}
      run: DEBUG=1 rebar3 as test coveralls send || /bin/true
    - name: Archive Test Output
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-output-${{ matrix.otp }}
        path: |
          _build/test/logs/
          !_build/test/logs/last

  finish:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Coveralls Finished
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
           curl -v -k https://coveralls.io/webhook \
                --header "Content-Type: application/json" \
                --data "{\"repo_name\":\"$GITHUB_REPOSITORY\",\"repo_token\":\"$GITHUB_TOKEN\",\"payload\":{\"build_num\":$GITHUB_RUN_ID,\"status\":\"done\"}}"
